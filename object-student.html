<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Details Using Object</title>
</head>
<body>

    <script>

      const  studentDetails = {
            firstName: "John",
            lastName: "Doe",
            age: 12
        };

        console.log(`${studentDetails.firstName} ${studentDetails.lastName} is ${studentDetails.age} years old.`);
    </script>

</body>
</html>
