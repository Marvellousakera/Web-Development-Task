<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Even or Odd Using Function</title>
</head>
<body>
    
    <script>   

        function isEven(n){

            if(n % 2 === 0){
                console.log('True');
            }else{
                console.log('False');
            }
  
        }
         
        isEven(40);
      
    </script>
</body>
</html>
