<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even/Odd Reporter</title>
</head>
<body>
    

    <script>

        for(let i = 0; i <= 20; i++){
           
            if(i % 2 === 0){
                console.log(`${i} is Even`);
            }else if(i % 2 === 1){
                console.log(`${i} is Odd`);
            }
        }
    </script>
</body>
</html>
