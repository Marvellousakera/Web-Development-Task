<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>non-existent property</title>
</head>
<body>
    <script>
        person = {
            name:"A"
        };

        console.log(person.age);

        //The console will show undefined because age does not exist in the object person
    </script>
</body>
</html>
