<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
</head>

<style>
      body{
         padding: 100px;
         background-color: antiquewhite;

      }

    button{
       color: white;
       background-color: black;
       padding: 20px;
       border-radius: 10px;
    }

</style>
<body>
    <p>
        <button onclick="
        inputDigit('1');
        ">1</button>
        <button onclick="
        inputDigit('2');
        ">2</button>
        <button onclick="
        inputDigit('3');
        ">3</button>
        <button onclick="
        inputDigit('+');
        ">+</button>
    </p>
    <p>
        <button onclick="
        inputDigit('4');
        ">4</button>
        <button onclick="
         inputDigit('5');
        ">5</button>
        <button onclick="
          inputDigit('6');
        ">6</button>
        <button onclick="
        inputDigit('-');
        ">-</button>
    </p>
    <p>
        <button onclick="
          inputDigit('7');
        ">7</button>
        <button onclick="
         inputDigit('8');
        ">8</button>

        <button onclick="
         inputDigit('89');
        ">9</button>
        <button onclick="
        inputDigit('/');
        ">÷</button>
    </p>
    <p>
        <button onclick="
         inputDigit('0');
        ">0</button>
        <button onclick="
          inputDigit('*');
        ">×</button>
        <button onclick="
         inputOperator = '';
         console.log('0');
        ">C</button>
        <button onclick="
         inputOperator = eval(inputOperator);
         console.log(inputOperator);
        ">=</button>
    </p>

    <script>
        
       let inputOperator = '';

       function inputDigit(digit){

          inputOperator += digit;
          console.log(inputOperator);
       }


     /* 
     - Create the function for the calculator system 
     - how to assign a variable
     - i learnt that is not all function are call  immediately after the creation of function
     - the request for the number to calculate and the system calculate it
     */
    </script>
</body>
</html>
