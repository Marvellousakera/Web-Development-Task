<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Property</title>
</head>
<body>
    <h1>Correct Way to Write Object Property</h1>

    <!-- Example -->
    <script>
        const object = {
            name: "Marvellous"
        };

        object.age = 14;
        console.log(object);

        //The "age" is a new property that was added to the above code 
    </script>

</body>
</html>
