<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Temperature to Fahreheit</title>
</head>
<body>
    <script>

        function cToF(celsius){
           
            console.log((celsius * 9/5) + 32 + 'F');
          
        } 

        cToF(50);


        /* 
        Learning Objective

        - i learnt how to convert temperature using function
        
        
        */
    </script>
</body>
</html>
