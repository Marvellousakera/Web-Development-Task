<!DOCTYPE html>

    <title>Square a Number</title>
</head>
<body>
    

    <script>

        function square(n){
            console.log(n * n);
        }

        square(14);


        /*
        - Create function for calculating the square of numbers
        - It allow the user to input a number and the returns the square of the number
        */
    </script>
</body>
