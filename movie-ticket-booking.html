<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Seat Booking</title>
</head>

<body>


    <script>

        const movie = {
            title: "Avengers",
            duration: 150
        };


        const Cinema = {

            showtime: {
                movie: movie,
                time: "7:00 PM"
            },


            seats: [

                [
                    {
                      row: 1,
                      number: 1,
                      status: "available"
                     },
        
                    { 
                     row: 1, 
                     number: 2, 
                     status: "available" 
                    },

                    { 
                     row: 1, 
                     number: 3, 
                     status: "available"
                    },
                    { 
                      row: 1, 
                      number: 4, 
                      status: "available" 
                    },
                    { 
                     row: 1, 
                     number: 5, 
                     status: "available" 
                    }
                ],

              
                [
                    { 
                      row: 2, 
                      number: 1, 
                      status: "available" 
                    },

                    { 
                      row: 2, 
                      number: 2, 
                      status: "available" 
                    },

                    { 
                     row: 2, 
                     number: 3, 
                     status: "available" 
                    },

                    { 
                     row: 2, 
                     number: 4, 
                     status: "available" 
                    },

                    { 
                     row: 2, 
                     number: 5, 
                     status: "available" 
                    }
                ],

               
                [
                    { 
                      row: 3, 
                      number: 1, 
                      status: "available" 
                    },
                    { 
                      row: 3, 
                      number: 2, 
                      status: "available" 
                    },
                    { row: 3, 
                      number: 3, 
                      status: "available" 
                    },

                    { 
                      row: 3, 
                      number: 4, 
                      status: "available" 
                    },

                    { 
                     row: 3, 
                     number: 5, 
                     status: "available" 
                    }
                ]
            ],


        
            showSeats: function() {

                console.log("");

                for (let row = 0; row < this.seats.length; row++) {

                    let result = "";

                    for (let col = 0; col < this.seats[row].length; col++) {

                        const seat = this.seats[row][col];

                        if (seat.status === "available") {

                            result = result + "O ";

                        } else {

                            result = result + "X ";
                        }
                    }

                    console.log("Row " + (row + 1) + ": " + result);
                }
            },


            
            bookSeat: function(row, col) {

                const seat = this.seats[row - 1][col - 1];


                if (seat.status === "booked") {

                    console.log("This seat is already booked.");

                } else {

                    seat.status = "booked";

                    console.log(
                        "Row " + row +
                        ", Seat " + col +
                        " booked successfully."
                    );
                }
            },


            cancelSeat: function(row, col) {

                const seat = this.seats[row - 1][col - 1];


                if (seat.status === "available") {

                    console.log("This seat is already available.");

                } else {

                    seat.status = "available";

                    console.log(
                        "Row " + row +
                        ", Seat " + col +
                        " is now available."
                    );
                }
            },


            summary: function() {

                let totalSeats = 0;

                let bookedSeats = 0;


                for (let row = 0; row < this.seats.length; row++) {

                    for (let col = 0; col < this.seats[row].length; col++) {

                        totalSeats++;


                        if (this.seats[row][col].status === "booked") {

                            bookedSeats++;
                        }
                    }
                }


                console.log("");

                console.log("Movie: " + this.showtime.movie.title);

                console.log("Time: " + this.showtime.time);

                console.log("Total seats: " + totalSeats);

                console.log("Booked seats: " + bookedSeats);

                console.log(
                    "Available seats: " +
                    (totalSeats - bookedSeats)
                );
            }

        };


        console.log("Movie: " + movie.title);

        console.log("Duration: " + movie.duration + " minutes");

        console.log("Showtime: " + Cinema.showtime.time);


        Cinema.showSeats();


        Cinema.bookSeat(1, 3);

        Cinema.bookSeat(2, 2);


        Cinema.showSeats();

        Cinema.bookSeat(1, 3);

        Cinema.cancelSeat(1, 3);


        Cinema.showSeats();


        Cinema.summary();

    </script>

</body>
</html>
