<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reversed sentence using array</title>
</head>
<body>
    

    <script>

   const sentence = "I love Javascript";

   const words = sentence.split(" ");    //split(" ") is used to convert the strings into array
   console.log(words);

   const reversedWords = words.reverse();
   console.log(reversedWords);

   const joinedSentence = reversedWords.join(" "); //join(" ") is used to convert the array into strings
   console.log(joinedSentence);


    </script>
</body>
</html>
