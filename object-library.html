<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>
      <script>
        const library = {

            books: [],

            addBook: function(book){
                this.books.push(book);

            },

            getCount: function() {
              return  this.books.length;

            },

            getAdults: function(people){

                const names = [];

                for (let i = 0; i < people.length; i++){
                    if(people[i].age >= 18){
                         names.push(people[i].name);
                    }
                }
                return names;
            }
        };

        library.addBook("1984");

        const people = [
            {
                name: "Amy",
                age: 15
            },
            {
                name: "Bob",
                age: 20
            }
        ];

        console.log(library.getCount());
        console.log(library.getAdults(people));
        
      </script>
</body>
</html>
