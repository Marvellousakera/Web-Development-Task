<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Objects</title>
</head>
<body>

    <script>

         function mergeObjects(obj1,obj2){
            return {
              ...obj1,
              ...obj2 
            };
         }

        const object = {
           object1: {a :1},
           object2: {b:2}
        };

          
        console.log(mergeObjects(object.object1,object.object2));
    </script>

</body>
</html>
